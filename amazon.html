<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Amazon interview prep — a curated LeetCode problem sheet with live progress tracking, by M Balaraman." />
    <meta name="author" content="M Balaraman" />
    <title>Amazon Interview Sheet | M Balaraman</title>
    <script>
        /* set theme before first paint to avoid a flash of the wrong theme (shared with portfolio) */
        (function () {
            try {
                var t = localStorage.getItem("theme");
                if (t) document.documentElement.setAttribute("data-theme", t);
            } catch (e) {}
        })();
    </script>
    <meta name="theme-color" content="#0a0b12" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        /* ============================================================
           THEME TOKENS  (shared design language with the portfolio)
        ============================================================ */
        :root {
            --font-display: "Sora", system-ui, sans-serif;
            --font-body: "Inter", system-ui, sans-serif;
            --font-mono: "JetBrains Mono", monospace;

            --accent: #6366f1;
            --accent-2: #22d3ee;
            --accent-3: #a855f7;
            --gradient: linear-gradient(120deg, var(--accent-2), var(--accent), var(--accent-3));

            --easy: #22c55e;
            --med:  #f59e0b;
            --hard: #f43f5e;

            --radius: 16px;
            --radius-sm: 10px;
            --maxw: 960px;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.45);
        }

        html[data-theme="dark"] {
            --bg: #0a0b12;
            --bg-2: #10121d;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-2: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.09);
            --text: #e8eaf2;
            --text-dim: #9aa0b5;
            --nav-bg: rgba(10, 11, 18, 0.6);
            --glow: rgba(99, 102, 241, 0.25);
        }

        html[data-theme="light"] {
            --bg: #f6f7fb;
            --bg-2: #eef0f7;
            --surface: #ffffff;
            --surface-2: #eef1f8;
            --border: rgba(15, 23, 42, 0.12);
            --text: #14161f;
            --text-dim: #55607a;
            --nav-bg: rgba(246, 247, 251, 0.72);
            --glow: rgba(99, 102, 241, 0.18);
            --accent-2: #0e7490;
        }

        html[data-theme="light"] .tile,
        html[data-theme="light"] .dash,
        html[data-theme="light"] .list { box-shadow: 0 6px 20px -12px rgba(15, 23, 42, 0.18); }
        html[data-theme="light"] .prob-title { color: #4f46e5; }
        html[data-theme="light"] .chip.E { color: #15803d; }
        html[data-theme="light"] .chip.M { color: #b45309; }
        html[data-theme="light"] .chip.H { color: #be123c; }

        /* ============================================================
           BASE
        ============================================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            transition: background 0.5s var(--ease), color 0.5s var(--ease);
            -webkit-font-smoothing: antialiased;
        }

        .bg-fx { position: fixed; inset: 0; z-index: -2; overflow: hidden; }
        .aurora {
            position: absolute; inset: -25%; pointer-events: none;
            background:
                radial-gradient(38% 40% at 18% 22%, rgba(99, 102, 241, 0.40), transparent 60%),
                radial-gradient(34% 36% at 82% 16%, rgba(34, 211, 238, 0.34), transparent 60%),
                radial-gradient(42% 44% at 62% 82%, rgba(168, 85, 247, 0.36), transparent 62%),
                radial-gradient(30% 32% at 40% 60%, rgba(34, 211, 238, 0.22), transparent 60%);
            filter: blur(30px) saturate(130%);
            animation: aurora-drift 26s ease-in-out infinite alternate;
            will-change: transform;
        }
        html[data-theme="light"] .aurora { opacity: 0.4; }
        @keyframes aurora-drift {
            0%   { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); }
            50%  { transform: translate3d(-3%, 2%, 0) rotate(4deg) scale(1.08); }
            100% { transform: translate3d(3%, -2%, 0) rotate(-3deg) scale(1.12); }
        }
        .blob {
            position: absolute; border-radius: 50%; filter: blur(70px);
            opacity: 0.35; animation: float 20s var(--ease) infinite alternate; will-change: transform;
        }
        .blob.b1 { width: 500px; height: 500px; background: var(--accent); top: -160px; left: -120px; }
        .blob.b2 { width: 460px; height: 460px; background: var(--accent-2); top: 30%; right: -140px; animation-delay: -6s; }
        .blob.b3 { width: 420px; height: 420px; background: var(--accent-3); bottom: -160px; left: 25%; animation-delay: -12s; }
        html[data-theme="light"] .blob { opacity: 0.18; }
        @keyframes float {
            0%   { transform: translate(0,0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.15); }
        }
        .grid-overlay {
            position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse at 50% 0%, black, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at 50% 0%, black, transparent 70%);
            opacity: 0.35;
        }

        a { color: inherit; text-decoration: none; }
        ::selection { background: var(--accent); color: #fff; }

        .skip-link {
            position: fixed; top: -60px; left: 16px; z-index: 1100;
            background: var(--accent); color: #fff; padding: 10px 18px; border-radius: 8px;
            font-weight: 600; transition: top 0.25s var(--ease);
        }
        .skip-link:focus { top: 16px; }
        a:focus-visible, button:focus-visible {
            outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px;
        }

        #scroll-progress {
            position: fixed; top: 0; left: 0; height: 3px; width: 0%;
            background: var(--gradient); z-index: 1000;
        }

        .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }

        /* ============================================================
           NAV  (same glass pill as portfolio)
        ============================================================ */
        nav {
            position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
            width: min(960px, calc(100% - 28px)); z-index: 900;
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 20px; border-radius: 999px;
            background: var(--nav-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            transition: padding 0.4s var(--ease), box-shadow 0.4s var(--ease), background 0.4s var(--ease);
        }
        nav.scrolled { padding: 8px 20px; box-shadow: var(--shadow); }
        .logo { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; letter-spacing: -0.5px; display: inline-flex; align-items: center; gap: 7px; }
        .logo span { color: var(--accent); }
        .logo .back { font-size: 0.85rem; color: var(--text-dim); font-weight: 500; }
        .nav-links { display: flex; align-items: center; gap: 4px; list-style: none; }
        .nav-links a {
            font-size: 0.9rem; font-weight: 500; color: var(--text-dim);
            padding: 7px 13px; border-radius: 999px; position: relative;
            transition: color 0.25s, background 0.25s, transform 0.25s;
        }
        .nav-links a:hover { color: var(--text); background: var(--surface-2); }
        .nav-links a.active {
            background: linear-gradient(120deg, var(--accent), var(--accent-3));
            color: #fff; box-shadow: 0 8px 20px -8px var(--glow);
        }
        .nav-links a.active:hover { color: #fff; transform: translateY(-1px); }
        .nav-right { display: flex; align-items: center; gap: 10px; }
        .icon-btn {
            width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border);
            background: var(--surface); color: var(--text); cursor: pointer;
            display: grid; place-items: center; font-size: 0.95rem;
            transition: transform 0.3s var(--ease), background 0.3s, border-color 0.3s, color 0.3s;
        }
        .icon-btn:hover { transform: translateY(-2px) rotate(-8deg); border-color: var(--accent); color: var(--accent); }
        .burger { display: none; }

        /* ============================================================
           PAGE HEAD
        ============================================================ */
        main { padding-top: 118px; padding-bottom: 90px; }
        .eyebrow {
            font-family: var(--font-mono); font-size: 0.82rem; letter-spacing: 2px;
            text-transform: uppercase; color: var(--accent-2); display: inline-flex; align-items: center; gap: 8px; margin-bottom: 12px;
        }
        .page-head h1 { font-family: var(--font-display); font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; line-height: 1.1; letter-spacing: -1px; }
        .page-head h1 .grad { background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; background-size: 200% auto; animation: shimmer 6s linear infinite; }
        @keyframes shimmer { to { background-position: 200% center; } }
        .page-head p.sub { color: var(--text-dim); margin-top: 12px; max-width: 620px; font-size: 1.05rem; }

        /* ============================================================
           DASHBOARD:  progress ring + difficulty tiles
        ============================================================ */
        .dash {
            display: grid; grid-template-columns: auto 1fr; gap: 32px; align-items: center;
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 28px; margin: 30px 0 22px; backdrop-filter: blur(8px);
        }
        .ring-wrap { position: relative; width: 148px; height: 148px; flex-shrink: 0; }
        .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .ring-track { fill: none; stroke: var(--surface-2); stroke-width: 12; }
        .ring-fill {
            fill: none; stroke: url(#ringGrad); stroke-width: 12; stroke-linecap: round;
            transition: stroke-dashoffset 0.9s var(--ease);
        }
        .ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
        .ring-center .pct { font-family: var(--font-display); font-size: 2rem; font-weight: 800; line-height: 1; }
        .ring-center .pct-lbl { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

        .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        .tile {
            background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 16px; position: relative; overflow: hidden;
            transition: transform 0.3s var(--ease), border-color 0.3s;
        }
        .tile:hover { transform: translateY(-3px); border-color: var(--accent); }
        .tile .t-num { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; line-height: 1.1; }
        .tile .t-lbl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-dim); margin-top: 3px; }
        .tile .t-bar { height: 5px; border-radius: 99px; background: var(--surface); margin-top: 12px; overflow: hidden; }
        .tile .t-bar span { display: block; height: 100%; border-radius: 99px; width: 0%; transition: width 0.9s var(--ease); }
        .tile.all  .t-num { color: var(--text); }        .tile.all  .t-bar span { background: var(--gradient); }
        .tile.easy .t-num { color: var(--easy); }         .tile.easy .t-bar span { background: var(--easy); }
        .tile.med  .t-num { color: var(--med); }          .tile.med  .t-bar span { background: var(--med); }
        .tile.hard .t-num { color: var(--hard); }         .tile.hard .t-bar span { background: var(--hard); }

        /* ============================================================
           CONTROLS:  search + segmented filter + reset
        ============================================================ */
        .controls {
            display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
            position: sticky; top: 82px; z-index: 50;
            padding: 12px; margin-bottom: 18px; border-radius: 999px;
            background: var(--nav-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
        }
        .search { flex: 1; min-width: 200px; position: relative; }
        .search i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 0.9rem; pointer-events: none; }
        .search input {
            width: 100%; height: 42px; padding: 0 14px 0 40px; font-size: 0.92rem; font-family: var(--font-body);
            background: var(--surface); border: 1px solid var(--border); border-radius: 999px; color: var(--text); outline: none;
            transition: border-color 0.25s, background 0.25s;
        }
        .search input::placeholder { color: var(--text-dim); }
        .search input:focus { border-color: var(--accent); background: var(--surface-2); }

        .seg { position: relative; display: flex; gap: 2px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; }
        .seg button {
            position: relative; z-index: 1; border: none; background: none; cursor: pointer;
            font-family: var(--font-body); font-size: 0.82rem; font-weight: 600; color: var(--text-dim);
            padding: 8px 15px; border-radius: 999px; transition: color 0.25s;
        }
        .seg button.active { color: #fff; }
        .seg .seg-ind {
            position: absolute; top: 4px; left: 4px; height: calc(100% - 8px); border-radius: 999px;
            background: linear-gradient(120deg, var(--accent), var(--accent-3));
            box-shadow: 0 8px 20px -8px var(--glow);
            transition: transform 0.35s var(--ease), width 0.35s var(--ease); z-index: 0;
        }
        .reset {
            display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 16px;
            border: 1px solid var(--border); background: var(--surface); color: var(--text-dim);
            border-radius: 999px; cursor: pointer; font-family: var(--font-body); font-size: 0.85rem; font-weight: 600;
            transition: color 0.25s, border-color 0.25s, background 0.25s;
        }
        .reset:hover { color: var(--hard); border-color: var(--hard); background: var(--surface-2); }

        /* ============================================================
           PROBLEM LIST
        ============================================================ */
        .list-meta { font-size: 0.82rem; color: var(--text-dim); margin: 0 4px 10px; font-family: var(--font-mono); }
        .list {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            overflow: hidden; backdrop-filter: blur(8px);
        }
        .row {
            display: flex; align-items: center; gap: 14px; padding: 13px 18px;
            border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
            position: relative; transition: background 0.2s;
        }
        .row:last-child { border-bottom: none; }
        .row:hover { background: var(--surface-2); }
        .row::before {
            content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: var(--gradient); opacity: 0; transition: opacity 0.25s;
        }
        .row:hover::before { opacity: 1; }
        .row.done { background: color-mix(in srgb, var(--easy) 8%, transparent); }

        .cb {
            width: 22px; height: 22px; border: 2px solid var(--border); border-radius: 7px; flex-shrink: 0;
            display: grid; place-items: center; font-size: 0.7rem; color: transparent;
            transition: background 0.25s var(--ease), border-color 0.25s, transform 0.25s var(--ease), color 0.2s;
        }
        .row:hover .cb { border-color: var(--accent); }
        .cb.checked {
            background: linear-gradient(120deg, var(--accent), var(--accent-3)); border-color: transparent; color: #fff;
            transform: scale(1.05);
        }
        .num { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-dim); min-width: 46px; flex-shrink: 0; }
        .prob-title { font-size: 0.95rem; color: var(--text); flex: 1; line-height: 1.4; transition: color 0.2s; }
        .prob-title:hover { color: var(--accent-2); }
        .row.done .prob-title { text-decoration: line-through; color: var(--text-dim); }
        .acc { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-dim); min-width: 52px; text-align: right; flex-shrink: 0; }
        .chip {
            font-size: 0.7rem; font-weight: 700; padding: 4px 11px; border-radius: 999px;
            min-width: 62px; text-align: center; flex-shrink: 0; letter-spacing: 0.3px;
        }
        .chip.E { background: color-mix(in srgb, var(--easy) 16%, transparent); color: color-mix(in srgb, var(--easy) 78%, white); border: 1px solid color-mix(in srgb, var(--easy) 30%, transparent); }
        .chip.M { background: color-mix(in srgb, var(--med) 16%, transparent);  color: color-mix(in srgb, var(--med) 82%, white);  border: 1px solid color-mix(in srgb, var(--med) 30%, transparent); }
        .chip.H { background: color-mix(in srgb, var(--hard) 16%, transparent); color: color-mix(in srgb, var(--hard) 82%, white); border: 1px solid color-mix(in srgb, var(--hard) 30%, transparent); }
        .open { color: var(--text-dim); font-size: 0.82rem; flex-shrink: 0; opacity: 0.55; transition: opacity 0.2s, color 0.2s, transform 0.2s; }
        .open:hover { opacity: 1; color: var(--accent-2); transform: translate(1px, -1px); }
        .empty { padding: 54px; text-align: center; color: var(--text-dim); }

        #to-top {
            position: fixed; bottom: 26px; right: 26px; width: 48px; height: 48px; border-radius: 50%;
            border: 1px solid var(--border); background: var(--nav-bg); backdrop-filter: blur(10px); color: var(--text);
            cursor: pointer; display: grid; place-items: center; font-size: 1rem; z-index: 800;
            opacity: 0; pointer-events: none; transform: translateY(12px);
            transition: opacity 0.3s var(--ease), transform 0.3s var(--ease), border-color 0.3s, color 0.3s;
        }
        #to-top.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
        #to-top:hover { border-color: var(--accent); color: var(--accent); }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }

        /* ============================================================
           RESPONSIVE
        ============================================================ */
        @media (max-width: 760px) {
            .dash { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
            .tiles { width: 100%; grid-template-columns: repeat(2, 1fr); }
            .nav-links {
                position: fixed; top: 74px; left: 50%; transform: translateX(-50%) scale(0.96);
                flex-direction: column; align-items: stretch; width: min(300px, calc(100% - 28px));
                background: var(--nav-bg); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
                border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; gap: 4px;
                opacity: 0; pointer-events: none; transition: opacity 0.3s var(--ease), transform 0.3s var(--ease); box-shadow: var(--shadow);
            }
            .nav-links.open { opacity: 1; pointer-events: auto; transform: translateX(-50%) scale(1); }
            .nav-links a { padding: 12px 14px; }
            .burger { display: grid; }
        }
        @media (max-width: 520px) {
            .controls { position: static; border-radius: var(--radius); }
            .acc { display: none; }
            .search { min-width: 100%; order: -1; }
            .row { gap: 10px; padding: 12px 14px; }
            .num { min-width: 40px; }
        }
    </style>
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>
    <div id="scroll-progress"></div>
    <div class="bg-fx"><div class="aurora"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
    <div class="grid-overlay"></div>

    <!-- ===================== NAV ===================== -->
    <nav id="nav">
        <a href="index.html" class="logo"><i class="fa-solid fa-arrow-left back" aria-hidden="true"></i> M<span>.</span>Balaraman</a>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Portfolio</a></li>
            <li><a href="index.html#coding">Coding</a></li>
            <li><a href="index.html#projects">Projects</a></li>
            <li><a href="amazon.html" class="active" aria-current="page">Interview Sheet</a></li>
        </ul>
        <div class="nav-right">
            <button class="icon-btn" id="themeToggle" aria-label="Toggle color theme"><i class="fa-solid fa-moon" aria-hidden="true"></i></button>
            <button class="icon-btn burger" id="burger" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
        </div>
    </nav>

    <main id="main">
        <div class="wrap">
            <!-- ===================== HEAD ===================== -->
            <div class="page-head">
                <span class="eyebrow"><i class="fa-brands fa-amazon" aria-hidden="true"></i> Interview Preparation</span>
                <h1>Amazon <span class="grad">LeetCode Sheet</span></h1>
                <p class="sub" id="sub">A curated set of the most-asked Amazon problems. Tick them off as you solve — progress saves to this browser automatically.</p>
            </div>

            <!-- ===================== DASHBOARD ===================== -->
            <section class="dash" aria-label="Progress overview">
                <div class="ring-wrap">
                    <svg viewBox="0 0 120 120" role="img" aria-label="Overall completion">
                        <defs>
                            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#22d3ee" />
                                <stop offset="50%" stop-color="#6366f1" />
                                <stop offset="100%" stop-color="#a855f7" />
                            </linearGradient>
                        </defs>
                        <circle class="ring-track" cx="60" cy="60" r="52" />
                        <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52" />
                    </svg>
                    <div class="ring-center">
                        <div class="pct" id="ringPct">0%</div>
                        <div class="pct-lbl">Solved</div>
                    </div>
                </div>
                <div class="tiles">

        /* ---------- SETUP ---------- */
        const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const EASY_TOTAL = ALL.filter(p => p[3] === "Easy").length;
        const MED_TOTAL  = ALL.filter(p => p[3] === "Medium").length;
        const HARD_TOTAL = ALL.filter(p => p[3] === "Hard").length;
        const RING_C = 2 * Math.PI * 52;

        const ringFill = document.getElementById("ringFill");
        ringFill.style.strokeDasharray = RING_C;
        ringFill.style.strokeDashoffset = RING_C;

        let done = new Set();
        let tab = "all";

        const $ = id => document.getElementById(id);

        function load() {
            try {
                const saved = localStorage.getItem("amz_lc_done");
                if (saved) done = new Set(JSON.parse(saved));
            } catch (e) {}
            updateStats();
            render();
        }
        function save() {
            try { localStorage.setItem("amz_lc_done", JSON.stringify([...done])); } catch (e) {}
        }

        function toggle(id) {
            if (done.has(id)) done.delete(id); else done.add(id);
            save();
            updateStats();
            render();
        }

        function pctOf(a, b) { return b ? Math.round((a / b) * 100) : 0; }

        function updateStats() {
            const eD = ALL.filter(p => p[3] === "Easy"   && done.has(p[0])).length;
            const mD = ALL.filter(p => p[3] === "Medium" && done.has(p[0])).length;
            const hD = ALL.filter(p => p[3] === "Hard"   && done.has(p[0])).length;
            $("s-done").textContent = done.size + " / " + ALL.length;
            $("s-easy").textContent = eD + " / " + EASY_TOTAL;
            $("s-med").textContent  = mD + " / " + MED_TOTAL;
            $("s-hard").textContent = hD + " / " + HARD_TOTAL;

            $("b-all").style.width  = pctOf(done.size, ALL.length) + "%";
            $("b-easy").style.width = pctOf(eD, EASY_TOTAL) + "%";
            $("b-med").style.width  = pctOf(mD, MED_TOTAL) + "%";
            $("b-hard").style.width = pctOf(hD, HARD_TOTAL) + "%";

            const pct = pctOf(done.size, ALL.length);
            $("ringPct").textContent = pct + "%";
            ringFill.style.strokeDashoffset = RING_C * (1 - pct / 100);
            $("sub").textContent = pct + "% complete — " + done.size + " of " + ALL.length + " Amazon problems solved.";
        }

        function render() {
            const q = $("srch").value.toLowerCase();
            const items = ALL.filter(p => {
                if (tab !== "all" && p[3] !== tab) return false;
                if (q && !p[1].toLowerCase().includes(q) && !String(p[0]).includes(q)) return false;
                return true;
            });
            const el = $("list");
            $("listMeta").textContent = items.length + " problem" + (items.length === 1 ? "" : "s") +
                (tab === "all" ? "" : " · " + tab) + (q ? ' · matching "' + $("srch").value + '"' : "");

            if (!items.length) {
                el.innerHTML = '<div class="empty">No problems match your search.</div>';
                return;
            }
            el.innerHTML = items.map(p => {
                const ck = done.has(p[0]);
                const b = p[3][0];
                const url = "https://leetcode.com/problems/" +
                    p[1].toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "/";
                return '<div class="row' + (ck ? " done" : "") + '" data-id="' + p[0] + '">' +
                    '<div class="cb' + (ck ? " checked" : "") + '"><i class="fa-solid fa-check" aria-hidden="true"></i></div>' +
                    '<span class="num">#' + p[0] + '</span>' +
                    '<a class="prob-title" href="' + url + '" target="_blank" rel="noopener" data-stop>' + p[1] + '</a>' +
                    '<span class="acc">' + p[2] + '</span>' +
                    '<span class="chip ' + b + '">' + p[3] + '</span>' +
                    '<a class="open" href="' + url + '" target="_blank" rel="noopener" data-stop aria-label="Open on LeetCode"><i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></a>' +
                    '</div>';
            }).join("");
        }

        /* ---------- EVENTS (delegated) ---------- */
        $("list").addEventListener("click", e => {
            if (e.target.closest("[data-stop]")) return;      // let LeetCode links through
            const row = e.target.closest(".row");
            if (row) toggle(Number(row.dataset.id));
        });
        $("srch").addEventListener("input", render);
        $("reset").addEventListener("click", () => {
            if (!confirm("Reset all progress? This cannot be undone.")) return;
            done.clear();
            save();
            updateStats();
            render();
        });

        /* ---------- SEGMENTED FILTER + sliding indicator ---------- */
        const seg = $("seg");
        const segInd = $("segInd");
        const segBtns = [...seg.querySelectorAll("button")];
        function moveIndicator(btn) {
            segInd.style.width = btn.offsetWidth + "px";
            segInd.style.transform = "translateX(" + (btn.offsetLeft - 4) + "px)";
        }
        segBtns.forEach(btn => btn.addEventListener("click", () => {
            tab = btn.dataset.tab;
            segBtns.forEach(b => { b.classList.remove("active"); b.setAttribute("aria-selected", "false"); });
            btn.classList.add("active");
            btn.setAttribute("aria-selected", "true");
            moveIndicator(btn);
            render();
        }));
        window.addEventListener("resize", () => moveIndicator(seg.querySelector("button.active")), { passive: true });

        /* ---------- THEME TOGGLE (shared key with portfolio) ---------- */
        const root = document.documentElement;
        const themeBtn = $("themeToggle");
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme) root.setAttribute("data-theme", savedTheme);
        const syncIcon = () => themeBtn.innerHTML = root.getAttribute("data-theme") === "dark"
            ? '<i class="fa-solid fa-moon" aria-hidden="true"></i>' : '<i class="fa-solid fa-sun" aria-hidden="true"></i>';
        syncIcon();
        themeBtn.addEventListener("click", () => {
            const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
            root.setAttribute("data-theme", next);
            localStorage.setItem("theme", next);
            syncIcon();
        });

        /* ---------- MOBILE MENU ---------- */
        const burger = $("burger");
        const navLinks = $("navLinks");
        const setMenu = open => { navLinks.classList.toggle("open", open); burger.setAttribute("aria-expanded", open); };
        burger.addEventListener("click", () => setMenu(!navLinks.classList.contains("open")));
        navLinks.querySelectorAll("a").forEach(a => a.addEventListener("click", () => setMenu(false)));
        document.addEventListener("keydown", e => { if (e.key === "Escape" && navLinks.classList.contains("open")) { setMenu(false); burger.focus(); } });

        /* ---------- NAV STATE + SCROLL PROGRESS + TO-TOP (rAF-batched) ---------- */
        const nav = $("nav");
        const progress = $("scroll-progress");
        const toTop = $("to-top");
        let scrollMax = 0;
        const measure = () => { scrollMax = document.documentElement.scrollHeight - window.innerHeight; };
        measure();
        window.addEventListener("resize", measure, { passive: true });
        let ticking = false;
        window.addEventListener("scroll", () => {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(() => {
                const y = window.scrollY;
                nav.classList.toggle("scrolled", y > 20);
                toTop.classList.toggle("show", y > 500);
                progress.style.width = (scrollMax > 0 ? (y / scrollMax) * 100 : 0) + "%";
                ticking = false;
            });
        }, { passive: true });
        toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: prefersReduced ? "auto" : "smooth" }));

        /* ---------- INIT ---------- */
        load();
        // position the segment indicator once layout is ready
        requestAnimationFrame(() => moveIndicator(seg.querySelector("button.active")));
    </script>
